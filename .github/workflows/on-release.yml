# After every release here: scan its builds on VirusTotal and wait for the verdicts (tools/virustotal.sh), point
# releases.json at it (tools/update_releases_json.sh), and redeploy the site so the download buttons follow.
# - Runs when a release is published, and again when one is edited (the app repo's tools/publish_public.sh edits it
#   after adding files, e.g. the macOS zips). This workflow's own edits use GITHUB_TOKEN, so they don't start it again.
# - Run it by hand for any release: Actions tab -> On release -> Run workflow, or from the app repo `just virustotal v0.11.0`.
# Needs the repo secret VIRUSTOTAL_API_KEY (virustotal.com -> Profile -> API Key); without it the scan is skipped.
name: On release

on:
  release:
    types: [published, edited]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, e.g. v0.11.0
        type: string
        required: true

# One run per tag; a newer event for the same tag replaces a run still in progress.
concurrency:
  group: on-release-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main  # today's scripts, even for an older release's tag
      - name: Scan the builds and write the results into the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: tools/virustotal.sh "$TAG"

  sync:
    needs: scan
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Point releases.json at this release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: tools/update_releases_json.sh "$TAG"
      - id: commit
        name: Commit releases.json
        env:
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          if git diff --quiet releases.json; then
            echo "changed=false" >>"$GITHUB_OUTPUT"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "release: $TAG"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >>"$GITHUB_OUTPUT"

  # A push made with GITHUB_TOKEN doesn't start pages.yml on its own, so deploy from here.
  deploy:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
