# After every release here: scan its builds on VirusTotal and wait for the verdicts (tools/virustotal.sh), point
# releases.json at it (tools/update_releases_json.sh), and only then redeploy the site, every run, so the download
# buttons follow. This is the only deploy a release makes; nothing deploys the site ahead of the scan.
# - Runs when a release is published, and on a "rescan" repository_dispatch, which the app repo's tools/publish_public.sh
#   sends after adding files to an existing release (e.g. the macOS zips). GitHub sends no release event for new files.
# - Run it by hand for any release: Actions tab -> On release -> Run workflow, or from the app repo `just virustotal v0.11.0`.
# Needs the repo secret VIRUSTOTAL_API_KEY (virustotal.com -> Profile -> API Key); without it the scan is skipped.
name: On release

on:
  release:
    types: [published]
  repository_dispatch:
    types: [rescan]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, e.g. v0.11.0
        type: string
        required: true

# One run per tag; a newer event for the same tag replaces a run still in progress.
concurrency:
  group: on-release-${{ inputs.tag || github.event.release.tag_name || github.event.client_payload.tag }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main  # today's scripts, even for an older release's tag
      - name: Scan the builds and write the results into the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
          TAG: ${{ inputs.tag || github.event.release.tag_name || github.event.client_payload.tag }}
        run: tools/virustotal.sh "$TAG"

  sync:
    needs: scan
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Point releases.json at this release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.event.release.tag_name || github.event.client_payload.tag }}
        run: tools/update_releases_json.sh "$TAG"
      - name: Commit releases.json
        env:
          TAG: ${{ inputs.tag || github.event.release.tag_name || github.event.client_payload.tag }}
        run: |
          if git diff --quiet releases.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "release: $TAG"
          git pull --rebase origin main
          git push origin HEAD:main

  # A push made with GITHUB_TOKEN doesn't start pages.yml on its own, so start it from here, also when releases.json
  # didn't change (a rescan). Dispatched rather than called: a called pages.yml runs as the release's tag commit, and
  # deploy-pages names the deployment after that commit. When the push of that same commit had already deployed the
  # site, Pages took the new deployment for the old one and kept serving the site from before releases.json moved.
  # A dispatch on main runs as main's tip, the releases.json commit just pushed.
  deploy:
    needs: sync
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
