# Publish a release's Android APKs to Myket (tools/myket.sh). on-release.yml starts it for every newly
# published release; run it by hand for an older tag or other options: Actions tab -> Myket -> Run workflow, or
# `gh workflow run myket.yml -f tag=v0.11.0`.
# Needs the repo secret MYKET_ACCESS_TOKEN (Myket developer panel -> the app -> in-app products -> verification token).
name: Myket

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, e.g. v0.11.0
        type: string
        required: true
      rollout:
        description: Staged rollout percentage
        type: number
        default: 100
      auto_publish:
        description: Publish on its own once Myket's review passes
        type: boolean
        default: true
      dry_run:
        description: Only check the secret and show what would be sent
        type: boolean
        default: false

concurrency:
  group: myket
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main  # today's script and changelog.md, even for an older tag
      - name: Upload the APKs and send the release for review
        env:
          GH_TOKEN: ${{ github.token }}
          MYKET_ACCESS_TOKEN: ${{ secrets.MYKET_ACCESS_TOKEN }}
          TAG: ${{ inputs.tag }}
          ROLLOUT: ${{ inputs.rollout }}
          AUTO_PUBLISH: ${{ inputs.auto_publish }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: tools/myket.sh "$TAG"
